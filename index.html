<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f2">
  <meta name="description" content="יומן שבועי וחודשי שאפשר למלא ולשמור בו הערות לכל יום.">
  <title>היומן שלי — שבועי וחודשי</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f2;
      --paper: #fff;
      --ink: #202820;
      --muted: #788078;
      --line: #e6e9e1;
      --green: #27785b;
      --green-dark: #1d5e46;
      --green-soft: #e8f3ed;
      --today: #edf7f0;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: radial-gradient(ellipse at 90% 0, #e5efe7 0, transparent 34rem), var(--bg); color: var(--ink); line-height: 1.5; }
    button, textarea { font: inherit; }
    button { color: inherit; }
    .page { width: min(1120px, calc(100% - 36px)); margin: 0 auto; padding: 38px 0 56px; }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 1.05rem; font-weight: 850; }
    .brand-mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 14px; background: var(--green); color: white; font-size: 1.3rem; }
    .save-state { color: var(--muted); font-size: .83rem; }
    .save-dot { display: inline-block; width: 8px; height: 8px; margin-left: 7px; border-radius: 50%; background: #49a878; }
    .intro { margin-bottom: 25px; }
    .eyebrow { color: var(--green); font-size: .76rem; font-weight: 850; letter-spacing: .08em; }
    h1 { margin: 5px 0 4px; font-size: clamp(2rem, 5vw, 3.25rem); letter-spacing: -.05em; line-height: 1.15; }
    .intro p { margin: 9px 0 0; color: var(--muted); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 25px 0 16px; padding: 13px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.82); }
    .view-switch, .period-controls { display: flex; align-items: center; gap: 7px; }
    .view-switch { padding: 4px; border-radius: 12px; background: #f1f3ee; }
    .button { min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: white; cursor: pointer; font-size: .85rem; font-weight: 750; transition: .18s ease; }
    .button:hover { border-color: #9ab9a5; }
    .button:focus-visible, textarea:focus-visible { outline: 3px solid #a8d1b5; outline-offset: 2px; }
    .view-button { border-color: transparent; background: transparent; color: var(--muted); }
    .view-button.active { background: white; color: var(--green-dark); box-shadow: 0 1px 5px #1c392015; }
    .today-button { border-color: #cfe1d4; color: var(--green-dark); }
    .period-button { display: grid; width: 40px; padding: 0; place-items: center; font-size: 1.2rem; }
    .period-title { min-width: 160px; margin: 0 7px; font-size: 1.06rem; font-weight: 850; text-align: center; }
    .calendar-panel { min-height: 360px; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); box-shadow: 0 12px 35px #20332408; }
    .weekday-row, .month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .weekday { padding: 12px 8px; border-bottom: 1px solid var(--line); background: #fbfcf9; color: var(--muted); font-size: .78rem; font-weight: 800; text-align: center; }
    .month-cell { min-width: 0; min-height: 145px; padding: 9px; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .month-cell:nth-child(7n) { border-left: 0; }
    .month-cell.outside { background: #fafbf9; }
    .month-cell.today { background: var(--today); }
    .month-cell.outside .date-number { color: #a7ada6; }
    .date-number { display: flex; align-items: center; justify-content: space-between; min-height: 27px; margin-bottom: 5px; font-size: .83rem; font-weight: 800; }
    .today-label { padding: 2px 6px; border-radius: 99px; background: #d7eddd; color: var(--green-dark); font-size: .62rem; }
    .day-note { display: block; width: 100%; min-height: 86px; resize: vertical; padding: 8px; border: 1px solid transparent; border-radius: 8px; outline: none; background: transparent; color: var(--ink); font-size: .78rem; line-height: 1.45; }
    .day-note::placeholder { color: #abb2aa; }
    .day-note:hover, .day-note:focus { border-color: #dce8dd; background: #fff; }
    .outside .day-note { color: #909890; }
    .week-list { display: grid; grid-template-columns: 1fr; }
    .week-day { display: grid; grid-template-columns: 145px minmax(0, 1fr); min-height: 116px; border-bottom: 1px solid var(--line); }
    .week-day:last-child { border-bottom: 0; }
    .week-day.today { background: var(--today); }
    .week-date { padding: 17px; border-left: 1px solid var(--line); }
    .week-name { display: block; color: var(--muted); font-size: .8rem; font-weight: 750; }
    .week-number { display: inline-block; margin-top: 3px; font-size: 1.15rem; font-weight: 900; }
    .week-day .day-note { min-height: 95px; margin: 9px; padding: 10px 12px; border-color: transparent; font-size: .88rem; }
    .week-day .day-note:hover, .week-day .day-note:focus { border-color: #dce8dd; }
    .empty-note { margin: 0; padding: 20px; color: var(--muted); font-size: .82rem; text-align: center; }
    .help { margin: 13px 4px 0; color: var(--muted); font-size: .79rem; }
    .help strong { color: var(--green-dark); }
    @media (max-width: 760px) {
      .page { width: min(100% - 20px, 600px); padding-top: 22px; }
      .topline { margin-bottom: 22px; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .period-controls { justify-content: space-between; }
      .period-title { min-width: 0; flex: 1; }
      .calendar-panel { overflow-x: auto; }
      .weekday-row, .month-grid { min-width: 700px; }
      .month-cell { min-height: 125px; padding: 7px; }
      .day-note { min-height: 70px; padding: 6px; }
      .week-day { grid-template-columns: 105px minmax(0, 1fr); }
      .week-date { padding: 14px 10px; }
    }
    @media (max-width: 420px) {
      .save-state { font-size: .72rem; }
      .brand-mark { width: 37px; height: 37px; }
      .button { padding-inline: 11px; }
      .view-switch { justify-content: space-around; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">י</span><span>היומן שלי</span></div>
      <div class="save-state" aria-live="polite"><span class="save-dot" aria-hidden="true"></span><span id="saveStatus">הכתיבה נשמרת אוטומטית</span></div>
    </header>
    <section class="intro" aria-labelledby="pageTitle">
      <div class="eyebrow">מקום לתכנן ולכתוב</div>
      <h1 id="pageTitle">השבוע והחודש שלך</h1>
      <p>בחרו תצוגה וכתבו בכל יום — ההערות נשמרות אוטומטית במכשיר הזה.</p>
    </section>
    <section class="toolbar" aria-label="כלי היומן">
      <div class="view-switch" role="group" aria-label="בחירת תצוגת יומן">
        <button class="button view-button active" id="weekViewButton" type="button" aria-pressed="true">שבוע</button>
        <button class="button view-button" id="monthViewButton" type="button" aria-pressed="false">חודש</button>
      </div>
      <div class="period-controls">
        <button class="button period-button" id="previousButton" type="button" aria-label="לתקופה הקודמת">›</button>
        <h2 class="period-title" id="periodTitle" aria-live="polite"></h2>
        <button class="button period-button" id="nextButton" type="button" aria-label="לתקופה הבאה">‹</button>
        <button class="button today-button" id="todayButton" type="button">היום</button>
      </div>
    </section>
    <section class="calendar-panel" id="calendar" aria-label="לוח שנה"></section>
    <p class="help"><strong>ההערות שלך פרטיות:</strong> הן נשמרות בדפדפן ונשארות גם כשעוברים בין תצוגת השבוע לתצוגת החודש.</p>
  </main>
  <script>
    (() => {
      const calendar = document.querySelector("#calendar");
      const periodTitle = document.querySelector("#periodTitle");
      const weekButton = document.querySelector("#weekViewButton");
      const monthButton = document.querySelector("#monthViewButton");
      const saveStatus = document.querySelector("#saveStatus");
      const storageKey = "my-calendar-notes-v1";
      const weekdays = ["יום ראשון", "יום שני", "יום שלישי", "יום רביעי", "יום חמישי", "יום שישי", "שבת"];
      const monthFormatter = new Intl.DateTimeFormat("he-IL", { month: "long", year: "numeric" });
      const dateFormatter = new Intl.DateTimeFormat("he-IL", { day: "numeric", month: "long" });
      const notes = loadNotes();
      let view = "week";
      let activeDate = atMidnight(new Date());
      let saveTimer;

      function atMidnight(date) {
        return new Date(date.getFullYear(), date.getMonth(), date.getDate());
      }

      function dateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function loadNotes() {
        try {
          const saved = localStorage.getItem(storageKey);
          return saved ? JSON.parse(saved) : {};
        } catch (error) {
          console.error("לא ניתן לטעון את ההערות שנשמרו.", error);
          return {};
        }
      }

      function saveNotes() {
        saveStatus.textContent = "שומר…";
        window.clearTimeout(saveTimer);
        saveTimer = window.setTimeout(() => {
          try {
            localStorage.setItem(storageKey, JSON.stringify(notes));
            saveStatus.textContent = "הכתיבה נשמרת אוטומטית";
          } catch (error) {
            console.error("לא ניתן לשמור את ההערות.", error);
            saveStatus.textContent = "השמירה נכשלה — בדקו את הגדרות הדפדפן";
          }
        }, 250);
      }

      function addNoteEditor(date, className) {
        const key = dateKey(date);
        const textarea = document.createElement("textarea");
        textarea.className = `day-note ${className || ""}`.trim();
        textarea.dataset.date = key;
        textarea.setAttribute("aria-label", `הערות ל${weekdays[date.getDay()]}, ${dateFormatter.format(date)}`);
        textarea.placeholder = "מה תרצו לזכור או לעשות?";
        textarea.value = notes[key] || "";
        textarea.addEventListener("input", () => {
          if (textarea.value) notes[key] = textarea.value;
          else delete notes[key];
          saveNotes();
        });
        return textarea;
      }

      function render() {
        const monthStart = new Date(activeDate.getFullYear(), activeDate.getMonth(), 1);
        const monthEnd = new Date(activeDate.getFullYear(), activeDate.getMonth() + 1, 0);
        periodTitle.textContent = view === "month" ? monthFormatter.format(activeDate) : `${dateFormatter.format(getWeekStart(activeDate))} – ${dateFormatter.format(addDays(getWeekStart(activeDate), 6))}`;
        weekButton.classList.toggle("active", view === "week");
        monthButton.classList.toggle("active", view === "month");
        weekButton.setAttribute("aria-pressed", String(view === "week"));
        monthButton.setAttribute("aria-pressed", String(view === "month"));
        calendar.replaceChildren();
        if (view === "week") renderWeek();
        else renderMonth(monthStart, monthEnd);
      }

      function renderWeek() {
        const list = document.createElement("div");
        list.className = "week-list";
        const start = getWeekStart(activeDate);
        for (let index = 0; index < 7; index += 1) {
          const date = addDays(start, index);
          const row = document.createElement("article");
          row.className = `week-day${dateKey(date) === dateKey(new Date()) ? " today" : ""}`;
          const dateBlock = document.createElement("div");
          dateBlock.className = "week-date";
          const name = document.createElement("span");
          name.className = "week-name";
          name.textContent = weekdays[date.getDay()];
          const number = document.createElement("span");
          number.className = "week-number";
          number.textContent = dateFormatter.format(date);
          dateBlock.append(name, number);
          row.append(dateBlock, addNoteEditor(date));
          list.append(row);
        }
        calendar.append(list);
      }

      function renderMonth(first, last) {
        const names = document.createElement("div");
        names.className = "weekday-row";
        ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"].forEach((label) => {
          const dayName = document.createElement("div");
          dayName.className = "weekday";
          dayName.textContent = label;
          names.append(dayName);
        });
        const grid = document.createElement("div");
        grid.className = "month-grid";
        const firstVisible = new Date(first.getFullYear(), first.getMonth(), 1 - first.getDay());
        const totalCells = Math.ceil((first.getDay() + last.getDate()) / 7) * 7;
        const todayKey = dateKey(new Date());
        for (let index = 0; index < totalCells; index += 1) {
          const date = addDays(firstVisible, index);
          const isCurrentMonth = date.getMonth() === first.getMonth();
          const key = dateKey(date);
          const cell = document.createElement("article");
          cell.className = `month-cell${isCurrentMonth ? "" : " outside"}${key === todayKey ? " today" : ""}`;
          const number = document.createElement("div");
          number.className = "date-number";
          const dayNumber = document.createElement("span");
          dayNumber.textContent = String(date.getDate());
          number.append(dayNumber);
          if (key === todayKey) {
            const today = document.createElement("span");
            today.className = "today-label";
            today.textContent = "היום";
            number.append(today);
          }
          cell.append(number, addNoteEditor(date));
          grid.append(cell);
        }
        calendar.append(names, grid);
      }

      function getWeekStart(date) {
        return addDays(date, -date.getDay());
      }

      function addDays(date, count) {
        const result = new Date(date);
        result.setDate(result.getDate() + count);
        return result;
      }

      weekButton.addEventListener("click", () => { view = "week"; render(); });
      monthButton.addEventListener("click", () => { view = "month"; render(); });
      document.querySelector("#previousButton").addEventListener("click", () => {
        activeDate = view === "week" ? addDays(activeDate, -7) : new Date(activeDate.getFullYear(), activeDate.getMonth() - 1, 1);
        render();
      });
      document.querySelector("#nextButton").addEventListener("click", () => {
        activeDate = view === "week" ? addDays(activeDate, 7) : new Date(activeDate.getFullYear(), activeDate.getMonth() + 1, 1);
        render();
      });
      document.querySelector("#todayButton").addEventListener("click", () => { activeDate = atMidnight(new Date()); render(); });
      render();
    })();
  </script>
</body>
</html>
